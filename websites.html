<!doctype html>
<html lang="en">

<head>
    <title>My Websites Portfolio</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=SN+Pro:ital,wght@0,200..900;1,200..900&display=swap"
        rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'SN Pro', sans-serif;
            overflow-x: hidden;
        }

        .parallax-container {
            position: relative;
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 50px;
        }

        .parallax-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            z-index: -1;
            filter: brightness(0.7);
        }

        .parallax-title {
            color: white;
            font-size: 3rem;
            font-weight: bold;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.8);
            text-align: center;
            z-index: 1;
        }

        .cards-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
            padding: 50px 20px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .card-bubble {
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
        }

        .card-bubble:hover {
            transform: translateY(-10px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.25);
        }

        .card-image {
            width: 100%;
            height: 250px;
            object-fit: cover;
            display: block;
        }

        .card-content {
            padding: 20px;
        }

        .card-title {
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 10px;
            color: #333;
        }

        .card-bio {
            font-size: 0.95rem;
            color: #666;
            margin-bottom: 15px;
            line-height: 1.5;
        }

        .card-link {
            display: inline-block;
            background: #007bff;
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            text-decoration: none;
            font-size: 0.9rem;
            transition: background 0.3s ease;
        }

        .card-link:hover {
            background: #0056b3;
            text-decoration: none;
            color: white;
        }

        .web-section {
            scroll-margin-top: 60px;
        }

        .section-title {
            text-align: center;
            font-size: 2.5rem;
            font-weight: bold;
            margin-bottom: 40px;
            color: #333;
        }

        nav.top-nav {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.7);
            padding: 15px 30px;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .top-nav-links {
            display: flex;
            gap: 30px;
        }

        .top-nav-links a {
            color: white;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .top-nav-links a:hover {
            color: #ffc107;
        }

        .carousel-container {
            position: relative;
            width: 100%;
            height: 300px;
            background: #f0f0f0;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 15px;
        }

        .carousel-slides {
            display: flex;
            overflow-x: auto;
            scroll-behavior: smooth;
            height: 100%;
        }

        .carousel-slide {
            flex-shrink: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .carousel-nav {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
        }

        .carousel-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.5);
            cursor: pointer;
            transition: background 0.3s ease;
        }

        .carousel-dot.active {
            background: white;
        }

        .web-section-wrapper {
            padding: 40px 20px;
            background: #f9f9f9;
        }

        .web-section-wrapper:nth-child(even) {
            background: white;
        }
    </style>
</head>

<body>
    <nav class="top-nav">
        <div class="top-nav-links">
            <a href="index.html">Home</a>
            <a href="#web1">Web 1</a>
            <a href="#web2">Web 2</a>
            <a href="#web3">Web 3</a>
        </div>
    </nav>

    <div style="margin-top: 60px;"></div>

    <!-- Web 1 Section -->
    <div class="parallax-container">
        <div class="parallax-bg" style="background-image: url('imgs/Web1/Broadway Brew.png');"></div>
        <h1 class="parallax-title">Web Design 1</h1>
    </div>

    <div class="web-section-wrapper">
        <div class="web-section" id="web1">
            <h2 class="section-title">Web 1 Projects</h2>
            <div class="cards-container" id="web1-cards"></div>
        </div>
    </div>

    <!-- Web 2 Section -->
    <div class="parallax-container">
        <div class="parallax-bg" style="background-image: url('imgs/Web2/RPS.png');"></div>
        <h1 class="parallax-title">Web Design 2</h1>
    </div>

    <div class="web-section-wrapper">
        <div class="web-section" id="web2">
            <h2 class="section-title">Web 2 Projects</h2>
            <div class="cards-container" id="web2-cards"></div>
        </div>
    </div>

    <!-- Web 3 Section -->
    <div class="parallax-container">
        <div class="parallax-bg" style="background-image: url('imgs/Web3/SweetsBySammy.png');"></div>
        <h1 class="parallax-title">Web Design 3</h1>
    </div>

    <div class="web-section-wrapper">
        <div class="web-section" id="web3">
            <h2 class="section-title">Web 3 Projects</h2>
            <div class="cards-container" id="web3-cards"></div>
        </div>
    </div>

    <footer class="container mt-5 mb-5 text-center">
        <p>&copy; 2026 Cooper Steiner Portfolio</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.min.js"></script>
    <script>
        // Load and display cards for each web section
        async function loadWebCards(webNumber) {
            try {
                const response = await fetch(`data/web${webNumber}.json`);
                const projects = await response.json();
                const container = document.getElementById(`web${webNumber}-cards`);

                projects.forEach(project => {
                    const card = createCard(project, webNumber);
                    container.appendChild(card);
                });
            } catch (error) {
                console.error(`Error loading web${webNumber} data:`, error);
            }
        }

        function createCard(project, webNumber) {
            const card = document.createElement('div');
            card.className = 'card-bubble';

            const imagesHTML = project.images.length > 1
                ? createCarousel(project.images)
                : `<img src="imgs/Web${webNumber}/${project.images[0]}" alt="${project.name}" class="card-image">`;

            card.innerHTML = `
        ${imagesHTML}
        <div class="card-content">
          <div class="card-title">${project.name}</div>
          <div class="card-bio">${project.bio}</div>
          <a href="${project.link}" target="_blank" class="card-link">View Website</a>
        </div>
      `;

            return card;
        }

        function createCarousel(images) {
            const carouselHTML = `
        <div class="carousel-container">
          <div class="carousel-slides" data-carousel>
            ${images.map(img => `<img src="imgs/Web${event.target.dataset.web}/${img}" class="carousel-slide" alt="Project image">`).join('')}
          </div>
          <div class="carousel-nav" data-nav>
            ${images.map((_, i) => `<div class="carousel-dot ${i === 0 ? 'active' : ''}" data-slide="${i}"></div>`).join('')}
          </div>
        </div>
      `;
            return carouselHTML;
        }

        // Initialize carousel functionality
        function initCarousels() {
            document.querySelectorAll('[data-carousel]').forEach(carousel => {
                const slides = carousel.querySelectorAll('.carousel-slide');
                const dots = carousel.parentElement.querySelectorAll('.carousel-dot');
                let currentIndex = 0;

                dots.forEach((dot, index) => {
                    dot.addEventListener('click', () => {
                        currentIndex = index;
                        updateCarousel(carousel, currentIndex, slides);
                        updateDots(dots, currentIndex);
                    });
                });

                // Auto-scroll carousel
                setInterval(() => {
                    currentIndex = (currentIndex + 1) % slides.length;
                    updateCarousel(carousel, currentIndex, slides);
                    updateDots(dots, currentIndex);
                }, 5000);
            });
        }

        function updateCarousel(carousel, index, slides) {
            const scrollAmount = index * carousel.querySelector('.carousel-slide').offsetWidth;
            carousel.scrollLeft = scrollAmount;
        }

        function updateDots(dots, index) {
            dots.forEach(dot => dot.classList.remove('active'));
            dots[index].classList.add('active');
        }

        // Load all web sections on page load
        window.addEventListener('DOMContentLoaded', () => {
            loadWebCards(1);
            loadWebCards(2);
            loadWebCards(3);

            setTimeout(initCarousels, 500);
        });
    </script>
</body>

</html>
